<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      try {
        var mode = localStorage.getItem("ygh-theme");
        if (mode === "day" || mode === "night") {
          document.documentElement.setAttribute("data-theme", mode);
        }
      } catch (e) {}
    })();
  </script>
  <title>Veiled Empyrean</title>
  <meta name="description" content="Reading, notes, and quiet tools.">
  <link rel="canonical" href="https://yurkingw.github.io/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/home.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="wordmark" href="/">Veiled Empyrean</a>
      <div class="seg theme-switch" role="group" aria-label="Color theme">
        <button type="button" data-theme-set="system" aria-pressed="true">Auto</button>
        <span class="seg-gap" aria-hidden="true">·</span>
        <button type="button" data-theme-set="day" aria-pressed="false">Day</button>
        <span class="seg-gap" aria-hidden="true">·</span>
        <button type="button" data-theme-set="night" aria-pressed="false">Night</button>
      </div>
    </div>
  </header>
  <main>
    <div class="foyer-card">
      <div class="foyer-head">
        <h1>Veiled Empyrean</h1>
        <p class="lede">Reading, notes, and quiet tools.</p>
      </div>
      <nav class="entries" aria-label="Entries">
        <a class="entry" href="/x-good-reads/">
          <span class="entry-title">Good Reads</span>
          <span class="entry-blurb">One X post, one page.</span>
          <span class="entry-hint" aria-hidden="true">→</span>
        </a>
        <a class="entry" href="/briefings/">
          <span class="entry-title">Briefings</span>
          <span class="entry-blurb">Short intelligence notes.</span>
          <span class="entry-hint" aria-hidden="true">→</span>
        </a>
      </nav>
    </div>
  </main>
  <footer class="colophon">
    <p>Independent pages. Sources stay with their authors.</p>
  </footer>
  <script>
    (function () {
      var root = document.documentElement;
      var storageKey = "ygh-theme";
      var buttons = document.querySelectorAll(".seg button[data-theme-set]");

      function read() {
        try {
          var mode = localStorage.getItem(storageKey);
          if (mode === "day" || mode === "night" || mode === "system") return mode;
        } catch (e) {}
        return "system";
      }

      function apply(mode, persist) {
        if (mode === "day" || mode === "night") root.setAttribute("data-theme", mode);
        else root.removeAttribute("data-theme");
        buttons.forEach(function (button) {
          button.setAttribute(
            "aria-pressed",
            button.getAttribute("data-theme-set") === mode ? "true" : "false"
          );
        });
        if (persist) {
          try { localStorage.setItem(storageKey, mode); } catch (e) {}
        }
      }

      apply(read(), false);
      buttons.forEach(function (button) {
        button.addEventListener("click", function () {
          apply(button.getAttribute("data-theme-set"), true);
        });
      });
    })();
  </script>
</body>
</html>
